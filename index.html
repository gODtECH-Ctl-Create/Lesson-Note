<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LessonHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <section id="lessonSplash" class="screen lesson-splash">
    <div class="education-icon">📚</div>
    <h1>LessonHub</h1>
    <p>Smart lesson management for teachers</p>
  </section>

  <section id="classScreen" class="screen app-screen">
    <div class="app-brand">LESSONHUB</div>
    <h1>Welcome to LessonHub</h1>
    <p class="intro">Choose the class you are teaching.</p>
    <div id="classSelector" class="class-grid"></div>
  </section>

  <section id="dashboardScreen" class="screen app-screen hidden">
    <div class="app-brand">LESSONHUB</div>
    <h1 id="dashboardClassName"></h1>
    <p class="intro">Teacher dashboard</p>
    <div class="dashboard-grid">
      <button id="openLessonsBtn">📚 Lesson Notes</button>
      <button id="openCompletedBtn">✅ Completed Lessons</button>
      <button id="openProgressBtn">📊 Progress</button>
    </div>
  </section>

  <section id="workspaceScreen" class="screen app-screen hidden">
    <div class="selected-class-banner">Current Class: <strong id="selectedClassName"></strong></div>

    <div class="source-bar">
      <div>
        <span id="sourceStatus" class="status-pill">Loading lesson source…</span>
        <small id="sourceUpdated"></small>
      </div>
      <button id="refreshSourceBtn" class="secondary-btn">Refresh</button>
    </div>

    <section class="selector-card">
      <div class="field">
        <label for="weekSelect">Academic Week</label>
        <select id="weekSelect"></select>
      </div>
      <div class="field">
        <label for="subjectSelect">Subject</label>
        <select id="subjectSelect"></select>
      </div>
      <button id="viewLessonBtn">View Lesson</button>
    </section>

    <section id="lessonSection" class="lesson-section hidden">
      <button id="closeLessonBtn" class="secondary-btn">Back</button>
      <h2 id="lessonTitle"></h2>
      <p id="lessonMeta"></p>
      <div id="lessonContainer"></div>
    </section>
  </section>
</div>
<script src="config.js"></script>
<script src="lessons.js"></script>
<script src="format-ranges-1.js"></script>
<script src="format-ranges-2.js"></script>
<script src="format-ranges-3.js"></script>
<script src="format-ranges-4.js"></script>
<script src="class-selection.js"></script>
<script src="class-ui.js"></script>
<script src="live-api.js"></script>
<script src="splash.js"></script>
<script src="app.js"></script>
</body>
</html>
