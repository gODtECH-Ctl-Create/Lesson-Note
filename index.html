<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Basic 3 live lesson note viewer for 2026" />
  <title>LESSON NOTE [BASIC 3] 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">LESSON NOTE · BASIC 3 · 2026</p>
      <h1>Basic 3 Lesson Notes</h1>
      <p class="intro">Choose the academic week and subject to open the complete lesson note.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="source-bar">
      <div>
        <span id="sourceStatus" class="status-pill">Loading lesson source…</span>
        <span id="sourceUpdated" class="source-updated"></span>
      </div>
      <button id="refreshSourceBtn" class="secondary-btn compact-btn" type="button">Refresh</button>
    </div>

    <section class="selector-card" aria-label="Lesson selector">
      <div class="field">
        <label for="weekSelect">Academic Week</label>
        <select id="weekSelect" disabled>
          <option value="">Loading weeks…</option>
        </select>
      </div>

      <div class="field">
        <label for="subjectSelect">Subject</label>
        <select id="subjectSelect" disabled>
          <option value="">Select subject</option>
        </select>
      </div>

      <button id="viewLessonBtn" disabled>View Lesson</button>
    </section>

    <section id="lessonSection" class="lesson-section hidden">
      <div class="lesson-toolbar">
        <div>
          <p id="lessonMeta" class="lesson-meta"></p>
          <h2 id="lessonTitle"></h2>
        </div>
        <button id="closeLessonBtn" class="secondary-btn">Close</button>
      </div>

      <div id="lessonContainer" class="lesson-container">
        <p class="placeholder">Choose a lesson to begin.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>LESSON NOTE [BASIC 3] 2026</p>
    </div>
  </footer>

  <script src="config.js"></script>

  <!-- Static snapshot: retained as a fallback until/if the live API is unavailable. -->
  <script src="lessons.js"></script>
  <script src="format-ranges-1.js"></script>
  <script src="format-ranges-2.js"></script>
  <script src="format-ranges-3.js"></script>
  <script src="format-ranges-4.js"></script>

  <script src="live-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
